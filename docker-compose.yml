name: wikipulse

# Every service has a memory limit: the whole stack must fit in a 16GB machine.
# Optional services are added behind compose profiles as their phase lands.

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      # "internal" is for other containers, "external" is for clients on the host.
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092" # Kafka API
      - "18081:18081" # Schema Registry
      - "9644:9644" # Admin API and Prometheus metrics
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 1500m

  console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
          schemaRegistry:
            enabled: true
            urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    mem_limit: 256m

  # --- Lakehouse (profile "lakehouse"): object storage + Iceberg catalog -----------------
  # Storage: docs/adr/0010-local-lakehouse-storage.md. Catalog: docs/adr/0012-lakekeeper-catalog.md
  # Images are pinned by digest as well as tag: a tag can be moved to different content, a digest cannot.

  # S3-compatible object storage. Holds the table files: Parquet data and Iceberg metadata.
  object-store:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    profiles: [lakehouse]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-wikipulse}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-wikipulse-dev-secret}
      RUSTFS_OBS_LOG_STDOUT_ENABLED: "true"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console at /rustfs/console/
    volumes:
      - object-store-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  # The catalog's database: which tables exist and where each table's current metadata file
  # is. Committing a write to a table means swapping that pointer in one transaction, which
  # is what makes Iceberg writes atomic.
  catalog-db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    profiles: [lakehouse]
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-lakekeeper-dev-password}
      POSTGRES_DB: lakekeeper
    volumes:
      - catalog-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper"]
      interval: 2s
      timeout: 5s
      retries: 15
    mem_limit: 256m

  # Creates or upgrades Lakekeeper's tables in the database, then exits.
  catalog-migrate:
    image: quay.io/lakekeeper/catalog:v0.14.1@sha256:7c5d6b178a1b5ae230bd7d3e7a09da4704ce58fafc66a8b90c3b6edb69ba9817
    profiles: [lakehouse]
    command: ["migrate"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:${CATALOG_DB_PASSWORD:-lakekeeper-dev-password}@catalog-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:${CATALOG_DB_PASSWORD:-lakekeeper-dev-password}@catalog-db:5432/lakekeeper
      # Encrypts the storage credentials Lakekeeper keeps in the database.
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${CATALOG_ENCRYPTION_KEY:-wikipulse-dev-encryption-key}
    depends_on:
      catalog-db:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m

  # The Iceberg REST catalog (Lakekeeper). Clients get no storage credentials: before each
  # S3 request they ask Lakekeeper to sign it, and it signs only requests inside the
  # table's location (remote signing). Web UI at http://localhost:8181/ui
  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.14.1@sha256:7c5d6b178a1b5ae230bd7d3e7a09da4704ce58fafc66a8b90c3b6edb69ba9817
    profiles: [lakehouse]
    command: ["serve"]
    environment:
      <<: *lakekeeper-env
      # The UI would otherwise load a third-party survey script.
      LAKEKEEPER__UI__ENABLE_SURVEYS: "false"
    ports:
      - "8181:8181" # Iceberg REST API (/catalog), management API and UI (/ui)
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 15
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
      object-store:
        condition: service_healthy
    mem_limit: 512m

  # --- Streaming (profile "streaming"): Spark jobs ----------------------------------------
  # See docs/adr/0011-spark-bronze-job.md

  # Bronze: every message of wiki.raw, appended unchanged to lakehouse.bronze.recentchange.
  bronze: &spark-job
    build:
      context: .
      dockerfile: streaming/Dockerfile
      target: runtime
    image: wikipulse-spark:dev
    profiles: [streaming]
    environment: &spark-env
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ICEBERG_CATALOG_URI: http://lakekeeper:8181/catalog
      # No storage credentials: every S3 request is signed by the catalog (remote signing).
      # The AWS SDK still needs a region to start; the catalog sends the real settings.
      AWS_REGION: us-east-1
      BRONZE_TRIGGER_SECONDS: ${BRONZE_TRIGGER_SECONDS:-60}
    volumes:
      - spark-checkpoints:/checkpoints
    ports:
      - "4040:4040" # Spark UI, with a Structured Streaming tab
    depends_on:
      redpanda:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
    # The JVM heap is 1g (--driver-memory in streaming/Dockerfile); the rest is for the
    # JVM's own overhead and the Python process.
    mem_limit: 2g

  # The same job for replays: wiki.replay into its own table, so replayed data never
  # mixes with live data (ADR-0008). Its checkpoint follows from the table name.
  bronze-replay:
    <<: *spark-job
    environment:
      <<: *spark-env
      BRONZE_SOURCE_TOPIC: wiki.replay
      BRONZE_TABLE: lakehouse.bronze_replay.recentchange
    ports:
      - "4041:4040" # Spark UI

volumes:
  redpanda-data:
  object-store-data:
  catalog-db:
  # Spark's record of what each job has read and committed. It belongs with the tables:
  # `make clean` deletes both, never one without the other.
  spark-checkpoints:
