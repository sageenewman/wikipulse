name: wikipulse

# Every service has a memory limit: the whole stack must fit in a 16GB machine.
# Optional services are added behind compose profiles as their phase lands.

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      # "internal" is for other containers, "external" is for clients on the host.
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092" # Kafka API
      - "18081:18081" # Schema Registry
      - "9644:9644" # Admin API and Prometheus metrics
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 1500m

  console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
          schemaRegistry:
            enabled: true
            urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    mem_limit: 256m

  # --- Lakehouse (profile "lakehouse"): object storage + Iceberg catalog -----------------
  # Same pair as Apache Iceberg's own quickstarts and tests. See docs/adr/0010-local-lakehouse-storage.md
  # Images are pinned by digest as well as tag: a tag can be moved to different content, a digest cannot.

  # S3-compatible object storage. Holds the table files: Parquet data and Iceberg metadata.
  object-store:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    profiles: [lakehouse]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-wikipulse}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-wikipulse-dev-secret}
      RUSTFS_OBS_LOG_STDOUT_ENABLED: "true"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console at /rustfs/console/
    volumes:
      - object-store-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  # Iceberg REST catalog (the Iceberg project's reference implementation). It records which
  # tables exist and where each table's current metadata file is. Committing a write to a
  # table means swapping that pointer, which is what makes Iceberg writes atomic.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1@sha256:f7d679d30ac9c640bdeb2c015dff533cd3c8f1c7d491ebcb5d436f9a42db1d6f
    profiles: [lakehouse]
    environment:
      # The catalog's own state goes to a SQLite file on a volume. The image default is /tmp,
      # which is lost when the container is recreated, while the data files would remain.
      CATALOG_URI: jdbc:sqlite:/home/iceberg/iceberg_catalog.db
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://object-store:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-wikipulse}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-wikipulse-dev-secret}
      AWS_REGION: us-east-1
    ports:
      - "8181:8181" # Iceberg REST API
    volumes:
      - iceberg-catalog:/home/iceberg
    depends_on:
      object-store:
        condition: service_healthy
    mem_limit: 512m

  # --- Streaming (profile "streaming"): Spark jobs ----------------------------------------
  # See docs/adr/0011-spark-bronze-job.md

  # Bronze: every message of wiki.raw, appended unchanged to lakehouse.bronze.recentchange.
  bronze: &spark-job
    build:
      context: .
      dockerfile: streaming/Dockerfile
      target: runtime
    image: wikipulse-spark:dev
    profiles: [streaming]
    environment: &spark-env
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      S3_ENDPOINT: http://object-store:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-wikipulse}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-wikipulse-dev-secret}
      AWS_REGION: us-east-1
      BRONZE_TRIGGER_SECONDS: ${BRONZE_TRIGGER_SECONDS:-60}
    volumes:
      - spark-checkpoints:/checkpoints
    ports:
      - "4040:4040" # Spark UI, with a Structured Streaming tab
    depends_on:
      redpanda:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
    # The JVM heap is 1g (--driver-memory in streaming/Dockerfile); the rest is for the
    # JVM's own overhead and the Python process.
    mem_limit: 2g

  # The same job for replays: wiki.replay into its own table, so replayed data never
  # mixes with live data (ADR-0008). Its checkpoint follows from the table name.
  bronze-replay:
    <<: *spark-job
    environment:
      <<: *spark-env
      BRONZE_SOURCE_TOPIC: wiki.replay
      BRONZE_TABLE: lakehouse.bronze_replay.recentchange
    ports:
      - "4041:4040" # Spark UI

volumes:
  redpanda-data:
  object-store-data:
  iceberg-catalog:
  # Spark's record of what each job has read and committed. It belongs with the tables:
  # `make clean` deletes both, never one without the other.
  spark-checkpoints:
