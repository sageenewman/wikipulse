[project]
name = "wikipulse"
version = "0.1.0"
description = "Real-time breaking-news detection from the live Wikipedia edit stream"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

# The repo is a set of services, not an installable library.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
