[project]
name = "wikipulse"
version = "0.1.0"
description = "Real-time breaking-news detection from the live Wikipedia edit stream"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

# The repo is a set of services, not an installable library.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# The streaming jobs run on the Spark image's Python 3.10 (streaming/Dockerfile).
per-file-target-version = { "streaming/**/*.py" = "py310", "tests/spark/**/*.py" = "py310" }

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

# PySpark is installed only in the Spark image, not in the project environment, so its
# types are unknown here (ADR-0011).
[[tool.mypy.overrides]]
module = ["pyspark", "pyspark.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
